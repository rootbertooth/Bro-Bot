services:
  botbro:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BROBOT_API_KEY=${BROBOT_API_KEY}
      - BROBOT_API_BASE_URL=${BROBOT_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - VITE_BOT_MODEL=${VITE_BOT_MODEL:-google/gemini-3.7-flash}
    restart: unless-stopped
